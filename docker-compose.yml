# docker-compose.yml
version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/trading.db
      - SECRET_KEY=mi-secreto-en-produccion
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:3000,https://tudominio.com
    volumes:
      - ./data:/app/data  # Persistir datos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

